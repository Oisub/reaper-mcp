[project]
name = "reaper-mcp"
version = "0.1.0"
description = "MCP server driving a live REAPER instance via a ReaScript Lua bridge"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.scripts]
reaper-mcp = "reaper_mcp.server:main"
reaper-mcp-install-bridge = "reaper_mcp.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reaper_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"bridge" = "reaper_mcp/bridge"
